# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Keycloak admin API, reached from the Docker network. Nothing is requested at container build.
    http_client:
        scoped_clients:
            keycloak.admin.client:
                base_uri: '%env(KEYCLOAK_INTERNAL_URL)%'
                timeout: 5
                max_duration: 15

    #esi: true
    #fragments: true

    # Log levels of Symfony's error listener (first matching class wins, matched with instanceof).
    # A business rejection or a refused request is a warning; anything else stays critical.
    exceptions:
        App\Shared\Exception\AbstractDomainException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\UnsupportedMediaTypeHttpException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\UnprocessableEntityHttpException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\UnauthorizedHttpException:
            log_level: warning
        Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException:
            log_level: warning

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
