services:
  php:
    build:
      context: .
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    extra_hosts:
      - host.docker.internal:host-gateway

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
