nelmio_api_doc:
    documentation:
        info:
            title: stubandgo public API
            description: Catalog of organizations and published events, order placement, simulated payment and ticket scanning (controllers of the event organization only, with a Keycloak access token). Errors follow RFC 9457 Problem Details.
            version: 1.0.0
        servers:
            - { url: /, description: Same origin as this API }
        security: []
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                Problem:
                    description: RFC 9457 Problem Details (application/problem+json).
                    type: object
                    required: [type, title, status, detail, instance]
                    properties:
                        type: { type: string, example: /problems/organization_not_found }
                        title: { type: string, example: Not Found }
                        status: { type: integer, example: 404 }
                        detail: { type: string, example: 'Organization with slug "unknown" not found.' }
                        instance: { type: string, example: /api/organizations/unknown }
                        violations:
                            type: array
                            description: Present on /problems/validation_failed only, one entry per rejected payload property.
                            items:
                                type: object
                                required: [propertyPath, message]
                                properties:
                                    propertyPath: { type: string, example: lines[0].quantity }
                                    message: { type: string, example: This value should be positive. }
                        orderStatus: { type: string, enum: [pending, paid, failed, expired], description: 'Present on payment problems (payment_declined, order_expired): the resulting order status.', example: failed }
                OrganizationReference:
                    type: object
                    required: [slug, name]
                    properties:
                        slug: { type: string, example: demo-rock-asso }
                        name: { type: string, example: Rock Asso }
                EventSummary:
                    type: object
                    required: [id, title, venue, startsAt, organization]
                    properties:
                        id: { type: string, description: ULID of the event, example: 01JAE5Z8Q3M4N6P7R8S9T0V1W2 }
                        title: { type: string, example: Soirée Rock }
                        venue: { type: string, example: La Cigale }
                        startsAt: { type: string, format: date-time, description: 'Start in UTC (RFC 3339, Z suffix); the front converts it for display', example: '2026-11-20T19:00:00Z' }
                        organization: { $ref: '#/components/schemas/OrganizationReference' }
                OrganizationAdmin:
                    description: An organization as the platform administration sees it.
                    type: object
                    required: [id, name, slug, commissionBasisPoints, status]
                    properties:
                        id: { type: string, description: ULID of the organization }
                        name: { type: string, example: Rock Asso }
                        slug: { type: string, example: demo-rock-asso }
                        commissionBasisPoints: { type: integer, description: Commission of the platform on each sale, in basis points (0 to 10000), example: 1000 }
                        status: { type: string, enum: [active, pending_keycloak], description: 'pending_keycloak: not yet provisioned in Keycloak, to be retried.' }
                PriceTier:
                    type: object
                    required: [id, label, priceCents]
                    properties:
                        id: { type: string, description: ULID of the price tier }
                        label: { type: string, example: Plein }
                        priceCents: { type: integer, description: Price in euro cents, example: 2500 }
                EventDetail:
                    type: object
                    required: [id, title, description, venue, startsAt, capacity, organization, priceTiers]
                    properties:
                        id: { type: string, description: ULID of the event }
                        title: { type: string }
                        description: { type: string }
                        venue: { type: string }
                        startsAt: { type: string, format: date-time, description: 'Start in UTC (RFC 3339, Z suffix); the front converts it for display', example: '2026-11-20T19:00:00Z' }
                        capacity: { type: integer, example: 200 }
                        organization: { $ref: '#/components/schemas/OrganizationReference' }
                        priceTiers:
                            type: array
                            items: { $ref: '#/components/schemas/PriceTier' }
                HealthCheck:
                    type: object
                    required: [healthy, detail]
                    properties:
                        healthy: { type: boolean }
                        detail: { type: string, example: 'Last beat 3 s ago.' }
                HealthReport:
                    description: Health report, not a problem; the same shape answers 200 and 503.
                    type: object
                    required: [status, checks]
                    properties:
                        status: { type: string, enum: [ok, degraded] }
                        checks:
                            description: One entry per check (database, rabbitmq, outbox, worker).
                            type: object
                            additionalProperties: { $ref: '#/components/schemas/HealthCheck' }
                OrganizationCatalog:
                    type: object
                    required: [slug, name, events]
                    properties:
                        slug: { type: string, example: demo-rock-asso }
                        name: { type: string, example: Rock Asso }
                        events:
                            type: array
                            items: { $ref: '#/components/schemas/EventSummary' }
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)
                - ^/(health|metrics)$
