# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Catalog.Application cannot depend on Messenger: handlers are registered here, not with #[AsMessageHandler].
    App\Catalog\Core\Application\Command\:
        resource: '../src/Catalog/Core/Application/Command/*Handler.php'
        tags:
            - { name: messenger.message_handler, bus: command.bus }
    App\Catalog\Core\Application\Query\:
        resource: '../src/Catalog/Core/Application/Query/*Handler.php'
        tags:
            - { name: messenger.message_handler, bus: query.bus }
    App\Catalog\Core\Application\Listener\:
        resource: '../src/Catalog/Core/Application/Listener/'
        tags:
            - { name: messenger.message_handler, bus: event.bus }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Shared\Bus\CommandBusInterface:
            alias: App\Shared\Infrastructure\Bus\MessengerCommandBus
            public: true
        App\Shared\Bus\QueryBusInterface:
            alias: App\Shared\Infrastructure\Bus\MessengerQueryBus
            public: true
        App\Shared\Bus\EventBusInterface:
            alias: App\Shared\Infrastructure\Bus\MessengerEventBus
            public: true
        App\Catalog\Core\Domain\EventRepositoryInterface:
            alias: App\Catalog\Infrastructure\DbalEventRepository
            public: true
        App\Catalog\Core\Domain\OrganizationRepositoryInterface:
            alias: App\Catalog\Infrastructure\DbalOrganizationRepository
            public: true
        App\Catalog\Core\Application\Published\EventSaleTermsProviderInterface:
            alias: App\Catalog\Core\Application\Published\RepositoryEventSaleTermsProvider
            public: true
        App\Catalog\Core\Application\Published\EventDisplayProviderInterface:
            alias: App\Catalog\Core\Application\Published\RepositoryEventDisplayProvider
            public: true
        App\Tests\Catalog\Core\Application\Fixtures\EventPublishedRecorder:
            public: true
        App\Tests\Shared\Infrastructure\Fixtures\:
            resource: '../tests/Shared/Infrastructure/Fixtures/'
            exclude: '../tests/Shared/Infrastructure/Fixtures/*Exception.php'
        App\Tests\Shared\Infrastructure\Outbox\Fixtures\:
            resource: '../tests/Shared/Infrastructure/Outbox/Fixtures/'
