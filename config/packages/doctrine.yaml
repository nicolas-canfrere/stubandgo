doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'

when@test:
    doctrine:
        dbal:
            # A single test database for every PHPUnit process: Infection sets
            # TEST_TOKEN per thread, so it must not be part of the name.
            dbname_suffix: '_test'
