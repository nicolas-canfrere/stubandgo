doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'

when@test:
    doctrine:
        dbal:
            # app_test, or app_test<N> for Infection thread N (Infection sets
            # TEST_TOKEN per thread; make mutation clones one database per thread
            # so that parallel mutant runs never wait on each other's locks).
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
