openapi: 3.0.0
info:
  title: 'stubandgo public API'
  description: 'Catalog of organizations and published events, order placement, simulated payment and ticket scanning (controllers of the event organization only, with a Keycloak access token). Errors follow RFC 9457 Problem Details.'
  version: 1.0.0
servers:
  -
    url: /
    description: 'Same origin as this API'
paths:
  '/api/events/{eventId}/scans':
    post:
      tags:
        - Access
      summary: 'Scan a ticket token at the gate of an event.'
      description: 'Consumes the admission right of the token for the event: only the first scan of a ticket is valid. Every authorized scan is recorded, a malformed token included (outcome "unknown"). Requires the Keycloak access token of a controller (realm role organization-controller) of the organization that owns the event; a refused scan is not recorded.'
      operationId: post_access_scan_ticket
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event whose gate scans the token.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanTicketRequest'
      responses:
        '200':
          description: 'The verdict of the scan, whatever it is.'
          content:
            application/json:
              schema:
                required:
                  - outcome
                  - firstUsedAt
                properties:
                  outcome: { type: string, enum: [valid, already_used, wrong_event, unknown] }
                  firstUsedAt: { description: 'For already_used only, when the ticket was first scanned, in UTC (RFC 3339, Z suffix); null otherwise.', type: string, format: date-time, example: '2026-11-20T19:00:00Z', nullable: true }
                type: object
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge); nothing is recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not a controller of the organization that owns the event, or the event does not exist or its identifier is not a ULID (/problems/forbidden); nothing is recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed); nothing is recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  /api/backoffice/events:
    get:
      tags:
        - Backoffice
      summary: 'List every event of the organization of the caller, drafts included.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin). The events are those of the organization of the token, by start date.'
      operationId: get_catalog_backoffice_list_events
      responses:
        '200':
          description: 'The events of the organization, by start date.'
          content:
            application/json:
              schema:
                required:
                  - events
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/BackofficeEventSummary' } }
                type: object
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of an organization known to the platform (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Backoffice
      summary: 'Create a draft event in the organization of the caller.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin). The organization is the one of the token, never taken from the request. The event starts as a draft, invisible to the public catalog.'
      operationId: post_catalog_backoffice_create_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: 'The draft event was created; its URL is in the Location header.'
          headers:
            Location:
              description: 'URL of the event.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeEvent'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of an organization known to the platform (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed) or a value that breaks a rule: /problems/invalid_value, or /problems/event_start_in_past when the start is not in the future.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/backoffice/events/{eventId}':
    get:
      tags:
        - Backoffice
      summary: 'Show an event of the organization of the caller, whatever its status.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin).'
      operationId: get_catalog_backoffice_get_event
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The event.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeEvent'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of the organization that owns the event, or the event does not exist (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Backoffice
      summary: 'Replace every field of a draft event, its price tiers included.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin). Only an unlocked draft can be revised. A tier with the identifier of a tier of the event is kept, one without identifier is created, one missing from the list is deleted.'
      operationId: put_catalog_backoffice_revise_event
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: 'The revised event.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeEvent'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of the organization that owns the event, or the event does not exist (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The event is published (/problems/event_not_draft) or locked because seats were taken (/problems/event_locked).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed) or a value that breaks a rule: /problems/invalid_value (including a tier of another event), or /problems/event_start_in_past.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  /api/backoffice/invitations:
    post:
      tags:
        - Backoffice
      summary: 'Invite a member into the organization of the caller.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin); the organization is the one of the token, never taken from the request. Keycloak sends the invitation email.'
      operationId: post_catalog_backoffice_invite_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '204':
          description: 'The invitation was sent.'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of an organization known to the platform (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The email address is already known to Keycloak (/problems/member_already_exists), or the organization is not provisioned in Keycloak yet (/problems/organization_not_active).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed) or an invalid email address or role (/problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'Keycloak is unreachable or refused the request (/problems/identity_provider_unavailable).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/backoffice/events/{eventId}/publication':
    post:
      tags:
        - Backoffice
      summary: 'Publish an event so that it appears in the public catalog and opens for sale.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin).'
      operationId: post_catalog_backoffice_publish_event
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The published event.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeEvent'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of the organization that owns the event, or the event does not exist (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The event is already published (/problems/event_already_published).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'The event has no price tier (/problems/event_without_price_tier) or starts in the past (/problems/event_start_in_past).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Backoffice
      summary: 'Take an event off sale: it goes back to draft.'
      description: 'Requires the Keycloak access token of an administrator of an organization (realm role organization-admin). Refused once seats have been taken.'
      operationId: delete_catalog_backoffice_unpublish_event
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The event, back to draft.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeEvent'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of the organization that owns the event, or the event does not exist (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The event is not published (/problems/event_not_published) or is locked because seats were taken (/problems/event_locked).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/events/{eventId}':
    get:
      tags:
        - Catalog
      summary: 'Show a published event with its price tiers.'
      operationId: get_catalog_get_event_detail
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The event detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          description: 'The event does not exist or is not published (problem type /problems/event_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'The event identifier is not a valid ULID (problem type /problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/api/organizations/{slug}':
    get:
      tags:
        - Catalog
      summary: 'Show an organization and its upcoming published events, earliest first.'
      description: 'Lists only the published events of the organization that have not started yet.'
      operationId: get_catalog_get_organization_catalog
      parameters:
        -
          name: slug
          in: path
          description: 'URL identifier of the organization.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The organization catalog.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCatalog'
        '404':
          description: 'No organization has this slug (problem type /problems/organization_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/events:
    get:
      tags:
        - Catalog
      summary: 'List the published events that have not started yet, earliest first.'
      operationId: get_catalog_list_upcoming_events
      responses:
        '200':
          description: 'The upcoming events.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'
  '/api/platform/organizations/{organizationId}/commission-rate':
    put:
      tags:
        - Platform
      summary: 'Change the commission rate of an organization.'
      description: 'Requires the Keycloak access token of a platform administrator (staff realm role platform-admin). The new rate applies to the orders placed afterwards.'
      operationId: put_catalog_platform_change_commission_rate
      parameters:
        -
          name: organizationId
          in: path
          description: 'ULID of the organization.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCommissionRateRequest'
      responses:
        '200':
          description: 'The organization with its new rate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAdmin'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not a platform administrator (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'No organization has this identifier (/problems/organization_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed) or a rate outside 0 to 10000 basis points (/problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  /api/platform/organizations:
    get:
      tags:
        - Platform
      summary: 'List every organization of the platform, by name.'
      description: 'Requires the Keycloak access token of a platform administrator (staff realm role platform-admin).'
      operationId: get_catalog_platform_list_organizations
      responses:
        '200':
          description: 'The organizations, in the alphabetical order of their names.'
          content:
            application/json:
              schema:
                required:
                  - organizations
                properties:
                  organizations: { type: array, items: { $ref: '#/components/schemas/OrganizationAdmin' } }
                type: object
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not a platform administrator (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Platform
      summary: 'Create an organization and provision it in Keycloak.'
      description: 'Requires the Keycloak access token of a platform administrator (staff realm role platform-admin). When Keycloak is unreachable the organization is created anyway and answers with the status pending_keycloak: retry with the provisioning route.'
      operationId: post_catalog_platform_create_organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: 'The organization was created, active or pending_keycloak; its URL is in the Location header.'
          headers:
            Location:
              description: 'URL of the organization.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAdmin'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not a platform administrator (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The slug or the name is already used by another organization (/problems/organization_slug_taken or /problems/organization_name_taken).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed, with a violations member) or a value that breaks a rule: /problems/invalid_value (name, slug or commission rate).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/platform/organizations/{organizationId}/invitations':
    post:
      tags:
        - Platform
      summary: 'Invite a member into any active organization.'
      description: 'Requires the Keycloak access token of a platform administrator (staff realm role platform-admin). Keycloak sends the invitation email. This is how the first administrator of an organization is invited.'
      operationId: post_catalog_platform_invite_member
      parameters:
        -
          name: organizationId
          in: path
          description: 'ULID of the organization.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '204':
          description: 'The invitation was sent.'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not a platform administrator (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'No organization has this identifier (/problems/organization_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The email address is already known to Keycloak (/problems/member_already_exists), or the organization is not provisioned in Keycloak yet (/problems/organization_not_active).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed) or an invalid email address or role (/problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'Keycloak is unreachable or refused the request (/problems/identity_provider_unavailable).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/platform/organizations/{organizationId}/provisioning':
    post:
      tags:
        - Platform
      summary: 'Provision an organization in Keycloak, or retry it.'
      description: 'Requires the Keycloak access token of a platform administrator (staff realm role platform-admin). Idempotent: an organization that is already active is returned as is, without calling Keycloak.'
      operationId: post_catalog_platform_provision_organization
      parameters:
        -
          name: organizationId
          in: path
          description: 'ULID of the organization.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The organization, active.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAdmin'
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not a platform administrator (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'No organization has this identifier (/problems/organization_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'Keycloak is unreachable or refused the request (/problems/identity_provider_unavailable); the organization stays pending_keycloak.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/events/{eventId}/availability':
    get:
      tags:
        - Sales
      summary: 'Show how many seats are still available for an event.'
      operationId: get_sales_get_event_availability
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The remaining seats.'
          content:
            application/json:
              schema:
                required:
                  - eventId
                  - remaining
                properties:
                  eventId: { type: string }
                  remaining: { type: integer, example: 42 }
                type: object
        '422':
          description: 'The event is not on sale (/problems/event_not_on_sale) or its identifier is not a valid ULID (/problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/api/backoffice/events/{eventId}/sales':
    get:
      tags:
        - Backoffice
      summary: 'Report the sales of an event of the organization of the caller.'
      description: 'Only paid orders count in the tickets and amounts, which are sums of the amounts frozen on the orders; the remaining seats also leave out the seats held by pending orders. Requires the Keycloak access token of an administrator of an organization (realm role organization-admin).'
      operationId: get_sales_backoffice_get_event_sales
      parameters:
        -
          name: eventId
          in: path
          description: 'ULID of the event.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The sales of the event; amounts are in euro cents. Every price tier of the event is listed, with zeros when it sold nothing.'
          content:
            application/json:
              schema:
                required:
                  - eventId
                  - seatsRemaining
                  - ticketsSold
                  - totalCents
                  - commissionCents
                  - netCents
                  - priceTiers
                properties:
                  eventId: { type: string }
                  seatsRemaining: { type: integer, example: 93 }
                  ticketsSold: { type: integer, example: 4 }
                  totalCents: { type: integer, example: 9000 }
                  commissionCents: { type: integer, example: 1150 }
                  netCents: { type: integer, example: 7850 }
                  priceTiers: { type: array, items: { required: [priceTierId, label, ticketsSold, totalCents], properties: { priceTierId: { type: string }, label: { type: string, example: 'Plein tarif' }, ticketsSold: { type: integer, example: 3 }, totalCents: { type: integer, example: 7500 } }, type: object } }
                type: object
        '401':
          description: 'Access token missing or invalid (/problems/unauthorized, with a WWW-Authenticate: Bearer challenge).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'The member is not an administrator of the organization that owns the event, or the event does not exist (/problems/forbidden).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerAuth: []
  '/api/orders/{orderId}':
    get:
      tags:
        - Sales
      summary: 'Show the status of an order (never the buyer email).'
      operationId: get_sales_get_order_status
      parameters:
        -
          name: orderId
          in: path
          description: 'ULID of the order.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The order status.'
          content:
            application/json:
              schema:
                required:
                  - id
                  - status
                  - eventId
                  - lines
                  - totalCents
                  - expiresAt
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending, paid, failed, expired] }
                  eventId: { type: string }
                  lines: { type: array, items: { properties: { priceTierId: { type: string }, quantity: { type: integer }, unitPriceCents: { type: integer } }, type: object } }
                  totalCents: { description: 'Total in euro cents.', type: integer }
                  expiresAt: { description: 'Payment deadline in UTC (RFC 3339, Z suffix); null unless the order is pending.', type: string, format: date-time, example: '2026-10-24T12:15:00Z', nullable: true }
                type: object
        '404':
          description: 'The order does not exist (problem type /problems/order_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'The order identifier is not a valid ULID (problem type /problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/api/orders/{orderId}/payment':
    post:
      tags:
        - Sales
      summary: 'Pay a pending order with a card (simulated: 4242424242424242 is accepted, any other card is declined).'
      operationId: post_sales_pay_order
      parameters:
        -
          name: orderId
          in: path
          description: 'ULID of the order.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOrderRequest'
      responses:
        '200':
          description: 'The order is paid.'
          content:
            application/json:
              schema:
                required:
                  - status
                properties:
                  status: { type: string, example: paid }
                type: object
        '402':
          description: 'The card was declined (problem type /problems/payment_declined, orderStatus member "failed").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'The order does not exist (problem type /problems/order_not_found).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The order expired before payment (/problems/order_expired, orderStatus member "expired") or is not pending (/problems/order_not_pending).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed) or invalid card number (/problems/invalid_value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/orders:
    post:
      tags:
        - Sales
      summary: 'Place an order and reserve its seats; a free order is paid at once.'
      operationId: post_sales_place_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: 'The order was placed; its URL is in the Location header.'
          headers:
            Location:
              description: 'URL of the order.'
              schema:
                type: string
          content:
            application/json:
              schema:
                required:
                  - id
                  - status
                properties:
                  id: { description: 'ULID of the order.', type: string }
                  status: { type: string, enum: [pending, paid] }
                type: object
        '409':
          description: 'Not enough seats left (problem type /problems/sold_out).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Malformed payload (/problems/validation_failed, with a violations member) or a business rule is broken: invalid_value, empty_order, order_too_large, unknown_price_tier, duplicate_price_tier, event_not_on_sale, sales_closed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health:
    get:
      tags:
        - Observability
      summary: 'Report the health of the database, RabbitMQ, the outbox and the worker.'
      description: 'Not cached. This route is not protected in L1.'
      operationId: get_observability_health
      responses:
        '200':
          description: 'Every check passes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: 'At least one check fails.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /metrics:
    get:
      tags:
        - Observability
      summary: 'Expose the application gauges for Prometheus.'
      description: 'Prometheus text exposition format 0.0.4: orders by status, seats taken per event, outbox backlog, scans by outcome, undelivered ticket bundles, worker heartbeat. This route is not protected in L1.'
      operationId: get_observability_metrics
      responses:
        '200':
          description: 'The current value of every gauge.'
          content:
            'text/plain; version=0.0.4':
              schema:
                type: string
                example: "# HELP stubandgo_scans Ticket scans by outcome.\n# TYPE stubandgo_scans gauge\nstubandgo_scans{outcome=\"valid\"} 12\n"
components:
  schemas:
    Problem:
      description: 'RFC 9457 Problem Details (application/problem+json).'
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          example: /problems/organization_not_found
        title:
          type: string
          example: 'Not Found'
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: 'Organization with slug "unknown" not found.'
        instance:
          type: string
          example: /api/organizations/unknown
        violations:
          description: 'Present on /problems/validation_failed only, one entry per rejected payload property.'
          type: array
          items:
            required:
              - propertyPath
              - message
            properties:
              propertyPath:
                type: string
                example: 'lines[0].quantity'
              message:
                type: string
                example: 'This value should be positive.'
            type: object
        orderStatus:
          description: 'Present on payment problems (payment_declined, order_expired): the resulting order status.'
          type: string
          example: failed
          enum:
            - pending
            - paid
            - failed
            - expired
      type: object
    OrganizationReference:
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          example: demo-rock-asso
        name:
          type: string
          example: 'Rock Asso'
      type: object
    EventSummary:
      required:
        - id
        - title
        - venue
        - startsAt
        - organization
      properties:
        id:
          description: 'ULID of the event'
          type: string
          example: 01JAE5Z8Q3M4N6P7R8S9T0V1W2
        title:
          type: string
          example: 'Soirée Rock'
        venue:
          type: string
          example: 'La Cigale'
        startsAt:
          description: 'Start in UTC (RFC 3339, Z suffix); the front converts it for display'
          type: string
          format: date-time
          example: '2026-11-20T19:00:00Z'
        organization:
          $ref: '#/components/schemas/OrganizationReference'
      type: object
    OrganizationAdmin:
      description: 'An organization as the platform administration sees it.'
      required:
        - id
        - name
        - slug
        - commissionBasisPoints
        - status
      properties:
        id:
          description: 'ULID of the organization'
          type: string
        name:
          type: string
          example: 'Rock Asso'
        slug:
          type: string
          example: demo-rock-asso
        commissionBasisPoints:
          description: 'Commission of the platform on each sale'
          type: integer
        status:
          description: 'pending_keycloak: not yet provisioned in Keycloak, to be retried.'
          type: string
          enum:
            - active
            - pending_keycloak
      type: object
    PriceTier:
      required:
        - id
        - label
        - priceCents
      properties:
        id:
          description: 'ULID of the price tier'
          type: string
        label:
          type: string
          example: Plein
        priceCents:
          description: 'Price in euro cents'
          type: integer
          example: 2500
      type: object
    EventDetail:
      required:
        - id
        - title
        - description
        - venue
        - startsAt
        - capacity
        - organization
        - priceTiers
      properties:
        id:
          description: 'ULID of the event'
          type: string
        title:
          type: string
        description:
          type: string
        venue:
          type: string
        startsAt:
          description: 'Start in UTC (RFC 3339, Z suffix); the front converts it for display'
          type: string
          format: date-time
          example: '2026-11-20T19:00:00Z'
        capacity:
          type: integer
          example: 200
        organization:
          $ref: '#/components/schemas/OrganizationReference'
        priceTiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTier'
      type: object
    BackofficeEventSummary:
      description: 'An event of an organization as its administrators list it.'
      required:
        - id
        - title
        - startsAt
        - status
        - locked
      properties:
        id:
          description: 'ULID of the event'
          type: string
        title:
          type: string
          example: 'Soirée Rock'
        startsAt:
          description: 'Start in UTC (RFC 3339, Z suffix); the front converts it for display'
          type: string
          format: date-time
          example: '2026-11-20T19:00:00Z'
        status:
          description: 'draft: invisible to the public catalog and closed for sale.'
          type: string
          enum:
            - draft
            - published
        locked:
          description: 'True once seats have been taken: the event can then be neither revised nor unpublished.'
          type: boolean
      type: object
    BackofficeEvent:
      description: 'An event of an organization with everything its administrators can edit.'
      required:
        - id
        - title
        - startsAt
        - status
        - locked
        - description
        - venue
        - capacity
        - priceTiers
      properties:
        id:
          description: 'ULID of the event'
          type: string
        title:
          type: string
          example: 'Soirée Rock'
        startsAt:
          description: 'Start in UTC (RFC 3339, Z suffix); the front converts it for display'
          type: string
          format: date-time
          example: '2026-11-20T19:00:00Z'
        status:
          type: string
          enum:
            - draft
            - published
        locked:
          type: boolean
        description:
          type: string
        venue:
          type: string
        capacity:
          type: integer
          example: 200
        priceTiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTier'
      type: object
    HealthCheck:
      required:
        - healthy
        - detail
      properties:
        healthy:
          type: boolean
        detail:
          type: string
          example: 'Last beat 3 s ago.'
      type: object
    HealthReport:
      description: 'Health report, not a problem; the same shape answers 200 and 503.'
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        checks:
          description: 'One entry per check (database, rabbitmq, outbox, worker).'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'
      type: object
    OrganizationCatalog:
      required:
        - slug
        - name
        - events
      properties:
        slug:
          type: string
          example: demo-rock-asso
        name:
          type: string
          example: 'Rock Asso'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
      type: object
    ScanTicketRequest:
      required:
        - token
      properties:
        token:
          description: 'Token read from the QR code of the ticket (43 base64url characters for a real ticket).'
          type: string
          example: gKLhZN-ot9fBxtYtPWJNQkFE2j03nIhf5Rfh3Q52pww
      type: object
    NewPriceTierRequest:
      required:
        - label
        - priceCents
      properties:
        label:
          description: 'Label of the price tier.'
          type: string
          example: 'Plein tarif'
        priceCents:
          description: 'Price in euro cents.'
          type: integer
          example: 2500
      type: object
    CreateEventRequest:
      required:
        - title
        - description
        - venue
        - startsAt
        - capacity
        - priceTiers
      properties:
        title:
          type: string
          example: 'Soirée Rock'
        description:
          type: string
          example: 'Trois groupes sur scène.'
        venue:
          type: string
          example: 'La Cigale'
        startsAt:
          description: 'Start as an ISO 8601 date-time with a UTC offset; it must be in the future.'
          type: string
          example: '2026-11-20T20:00:00+01:00'
        capacity:
          description: 'Number of seats.'
          type: integer
          example: 200
        priceTiers:
          description: 'The price tiers of the event; each one gets a new identifier.'
          type: array
          items:
            $ref: '#/components/schemas/NewPriceTierRequest'
      type: object
    InviteMemberRequest:
      required:
        - email
        - role
      properties:
        email:
          description: 'Email address of the invited member; it must not belong to a Keycloak user yet.'
          type: string
          example: nouveau@rock-asso.test
        role:
          description: 'Role of the invited member in the organization.'
          type: string
          example: controller
          enum:
            - admin
            - controller
      type: object
    PriceTierRequest:
      required:
        - label
        - priceCents
      properties:
        label:
          description: 'Label of the price tier.'
          type: string
          example: 'Plein tarif'
        priceCents:
          description: 'Price in euro cents.'
          type: integer
          example: 2500
        id:
          description: 'ULID of an existing tier of the event, to keep it; omitted, a new tier is created.'
          type: string
          nullable: true
          default: null
      type: object
    EventRequest:
      required:
        - title
        - description
        - venue
        - startsAt
        - capacity
        - priceTiers
      properties:
        title:
          type: string
          example: 'Soirée Rock'
        description:
          type: string
          example: 'Trois groupes sur scène.'
        venue:
          type: string
          example: 'La Cigale'
        startsAt:
          description: 'Start as an ISO 8601 date-time with a UTC offset; it must be in the future.'
          type: string
          example: '2026-11-20T20:00:00+01:00'
        capacity:
          description: 'Number of seats.'
          type: integer
          example: 200
        priceTiers:
          description: 'The complete list of price tiers: a tier missing from it is deleted on revision.'
          type: array
          items:
            $ref: '#/components/schemas/PriceTierRequest'
      type: object
    ChangeCommissionRateRequest:
      required:
        - commissionBasisPoints
      properties:
        commissionBasisPoints:
          description: 'Commission of the platform on each sale, in basis points (0 to 10000).'
          type: integer
      type: object
    CreateOrganizationRequest:
      required:
        - name
        - slug
        - commissionBasisPoints
      properties:
        name:
          description: 'Display name of the organization, unique.'
          type: string
          example: 'Rock Asso'
        slug:
          description: 'URL identifier, unique: 3 to 64 lowercase letters, digits or single hyphens between them.'
          type: string
          example: rock-asso
        commissionBasisPoints:
          description: 'Commission of the platform on each sale, in basis points (0 to 10000).'
          type: integer
      type: object
    PayOrderRequest:
      required:
        - cardNumber
      properties:
        cardNumber:
          type: string
          example: '4242424242424242'
      type: object
    OrderLineRequest:
      required:
        - priceTierId
        - quantity
      properties:
        priceTierId:
          description: 'ULID of the price tier.'
          type: string
        quantity:
          type: integer
          example: 2
      type: object
    PlaceOrderRequest:
      required:
        - eventId
        - buyerEmail
        - lines
      properties:
        eventId:
          description: 'ULID of the event.'
          type: string
        buyerEmail:
          type: string
          example: buyer@example.com
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineRequest'
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
security: []
tags:
  -
    name: Access
    description: Access
  -
    name: Backoffice
    description: Backoffice
  -
    name: Catalog
    description: Catalog
  -
    name: Platform
    description: Platform
  -
    name: Sales
    description: Sales
  -
    name: Observability
    description: Observability

